<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Georgia, serif;
      font-size: 18px;
      background: #fff;
      color: #000;
      padding: 10px;
    }
    h1 {
      font-size: 22px;
      text-align: center;
      padding: 10px 0;
      border-bottom: 2px solid #000;
      margin-bottom: 12px;
    }
    #setup {
      padding: 10px;
      border: 1px solid #000;
      margin-bottom: 10px;
    }
    #setup label { display: block; margin-bottom: 6px; font-weight: bold; }
    #api-key-input {
      width: 100%;
      padding: 8px;
      font-size: 16px;
      border: 1px solid #000;
      margin-bottom: 8px;
    }
    .btn-primary {
      padding: 10px 16px;
      font-size: 18px;
      background: #000;
      color: #fff;
      border: none;
      cursor: pointer;
      width: 100%;
    }
    .btn-secondary {
      padding: 8px;
      font-size: 16px;
      background: #fff;
      color: #000;
      border: 2px solid #000;
      cursor: pointer;
      width: 100%;
    }
    #chat-container { display: none; }
    #key-bar {
      font-size: 13px;
      margin-bottom: 8px;
      text-align: right;
    }
    #key-bar button {
      font-size: 13px;
      background: none;
      border: none;
      text-decoration: underline;
      cursor: pointer;
      padding: 0;
    }
    #messages {
      border: 1px solid #000;
      height: 420px;
      overflow-y: scroll;
      padding: 10px;
      margin-bottom: 8px;
      background: #f9f9f9;
    }
    .message { margin-bottom: 14px; }
    .role-label {
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 3px;
    }
    .message.user .role-label { text-align: right; }
    .message.user .content {
      background: #e0e0e0;
      display: inline-block;
      float: right;
      clear: both;
      padding: 6px 10px;
      max-width: 90%;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .message.assistant .content { word-wrap: break-word; }
    .message.assistant .content p { margin-bottom: 8px; }
    .message.assistant .content p:last-child { margin-bottom: 0; }
    .message.assistant .content h1,
    .message.assistant .content h2,
    .message.assistant .content h3,
    .message.assistant .content h4 {
      margin: 10px 0 4px;
      font-size: 1em;
      border-bottom: 1px solid #bbb;
      padding-bottom: 2px;
    }
    .message.assistant .content ul,
    .message.assistant .content ol { margin: 4px 0 8px 22px; }
    .message.assistant .content li { margin-bottom: 2px; }
    .message.assistant .content pre {
      background: #e8e8e8;
      border: 1px solid #bbb;
      padding: 8px;
      overflow-x: auto;
      font-size: 14px;
      margin: 6px 0;
      white-space: pre;
      word-wrap: normal;
    }
    .message.assistant .content code {
      background: #e8e8e8;
      padding: 1px 4px;
      font-size: 15px;
      font-family: monospace;
    }
    .message.assistant .content pre code {
      background: none;
      padding: 0;
      font-size: 14px;
    }
    .clearfix::after { content: ""; display: table; clear: both; }
    #status {
      text-align: center;
      font-style: italic;
      min-height: 22px;
      margin-bottom: 6px;
      font-size: 16px;
    }
    #user-input {
      width: 100%;
      padding: 10px;
      font-size: 18px;
      font-family: Georgia, serif;
      border: 2px solid #000;
      min-height: 80px;
      resize: vertical;
      margin-bottom: 8px;
      display: block;
    }
    #send-btn { margin-bottom: 6px; }
    #send-btn:disabled { background: #666; }
    #model-select {
      width: 100%;
      padding: 6px;
      font-size: 14px;
      border: 1px solid #000;
      margin-bottom: 8px;
    }
    .setup-note {
      font-size: 13px;
      color: #444;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <h1>Claude Chat</h1>

  <div id="setup">
    <label for="api-key-input">Anthropic API Key:</label>
    <input type="password" id="api-key-input" placeholder="sk-ant-..." autocomplete="off">
    <p class="setup-note">Your key is stored only in this browser's local storage and sent directly to Anthropic.</p>
    <br>
    <button class="btn-primary" onclick="saveApiKey()">Save &amp; Start Chatting</button>
  </div>

  <div id="chat-container">
    <div id="key-bar">
      <button onclick="changeKey()">Change API key</button>
    </div>

    <select id="model-select">
      <option value="claude-sonnet-4-6">Claude Sonnet 4.6 (recommended)</option>
      <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5 (faster)</option>
      <option value="claude-opus-4-6">Claude Opus 4.6 (most capable)</option>
    </select>

    <div id="messages"></div>
    <div id="status"></div>
    <textarea id="user-input" placeholder="Type your message here..."></textarea>
    <button id="send-btn" class="btn-primary" onclick="sendMessage()">Send</button>
    <button class="btn-secondary" onclick="clearChat()">Clear Chat</button>
  </div>

  <script src="markdown.js"></script>
  <script src="api.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
