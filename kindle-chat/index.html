<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Georgia, serif;
      font-size: 18px;
      background: #fff;
      color: #000;
      padding: 10px;
    }
    h1 {
      font-size: 22px;
      text-align: center;
      padding: 10px 0;
      border-bottom: 2px solid #000;
      margin-bottom: 12px;
    }
    #setup {
      padding: 10px;
      border: 1px solid #000;
      margin-bottom: 10px;
    }
    #setup label { display: block; margin-bottom: 6px; font-weight: bold; }
    #api-key-input {
      width: 100%;
      padding: 8px;
      font-size: 16px;
      border: 1px solid #000;
      margin-bottom: 8px;
    }
    .btn-primary {
      padding: 10px 16px;
      font-size: 18px;
      background: #000;
      color: #fff;
      border: none;
      cursor: pointer;
      width: 100%;
    }
    .btn-secondary {
      padding: 8px;
      font-size: 16px;
      background: #fff;
      color: #000;
      border: 2px solid #000;
      cursor: pointer;
      width: 100%;
    }
    #chat-container { display: none; }
    #key-bar {
      font-size: 13px;
      margin-bottom: 8px;
      text-align: right;
    }
    #key-bar button {
      font-size: 13px;
      background: none;
      border: none;
      text-decoration: underline;
      cursor: pointer;
      padding: 0;
    }
    #messages {
      border: 1px solid #000;
      height: 420px;
      overflow-y: scroll;
      padding: 10px;
      margin-bottom: 8px;
      background: #f9f9f9;
    }
    .message { margin-bottom: 14px; }
    .role-label {
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 3px;
    }
    .message.user .role-label { text-align: right; }
    .message.user .content {
      background: #e0e0e0;
      display: inline-block;
      float: right;
      clear: both;
      padding: 6px 10px;
      max-width: 90%;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .message.assistant .content { word-wrap: break-word; }
    .message.assistant .content p { margin-bottom: 8px; }
    .message.assistant .content p:last-child { margin-bottom: 0; }
    .message.assistant .content h1,
    .message.assistant .content h2,
    .message.assistant .content h3,
    .message.assistant .content h4 {
      margin: 10px 0 4px;
      font-size: 1em;
      border-bottom: 1px solid #bbb;
      padding-bottom: 2px;
    }
    .message.assistant .content ul,
    .message.assistant .content ol { margin: 4px 0 8px 22px; }
    .message.assistant .content li { margin-bottom: 2px; }
    .message.assistant .content pre {
      background: #e8e8e8;
      border: 1px solid #bbb;
      padding: 8px;
      overflow-x: auto;
      font-size: 14px;
      margin: 6px 0;
      white-space: pre;
      word-wrap: normal;
    }
    .message.assistant .content code {
      background: #e8e8e8;
      padding: 1px 4px;
      font-size: 15px;
      font-family: monospace;
    }
    .message.assistant .content pre code {
      background: none;
      padding: 0;
      font-size: 14px;
    }
    .clearfix::after { content: ""; display: table; clear: both; }
    #status {
      text-align: center;
      font-style: italic;
      min-height: 22px;
      margin-bottom: 6px;
      font-size: 16px;
    }
    #user-input {
      width: 100%;
      padding: 10px;
      font-size: 18px;
      font-family: Georgia, serif;
      border: 2px solid #000;
      min-height: 80px;
      resize: vertical;
      margin-bottom: 8px;
      display: block;
    }
    #send-btn { margin-bottom: 6px; }
    #send-btn:disabled { background: #666; }
    #model-select {
      width: 100%;
      padding: 6px;
      font-size: 14px;
      border: 1px solid #000;
      margin-bottom: 8px;
    }
    .setup-note {
      font-size: 13px;
      color: #444;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <h1>Claude Chat</h1>

  <div id="setup">
    <label for="api-key-input">Anthropic API Key:</label>
    <input type="password" id="api-key-input" placeholder="sk-ant-..." autocomplete="off">
    <p class="setup-note">Your key is stored only in this browser's local storage and sent directly to Anthropic.</p>
    <br>
    <button class="btn-primary" onclick="saveApiKey()">Save &amp; Start Chatting</button>
  </div>

  <div id="chat-container">
    <div id="key-bar">
      <button onclick="changeKey()">Change API key</button>
    </div>

    <select id="model-select">
      <option value="claude-sonnet-4-6">Claude Sonnet 4.6 (recommended)</option>
      <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5 (faster)</option>
      <option value="claude-opus-4-6">Claude Opus 4.6 (most capable)</option>
    </select>

    <div id="messages"></div>
    <div id="status"></div>
    <textarea id="user-input" placeholder="Type your message here..."></textarea>
    <button id="send-btn" class="btn-primary" onclick="sendMessage()">Send</button>
    <button class="btn-secondary" onclick="clearChat()">Clear Chat</button>
  </div>

  <script>
    var API_KEY = '';
    var conversation = [];

    function getModel() {
      var sel = document.getElementById('model-select');
      return sel ? sel.value : 'claude-sonnet-4-6';
    }

    function init() {
      var stored = '';
      try { stored = localStorage.getItem('claude_api_key') || ''; } catch(e) {}
      if (stored) {
        API_KEY = stored;
        showChat();
        try {
          var saved = localStorage.getItem('claude_conversation');
          if (saved) {
            conversation = JSON.parse(saved);
            for (var i = 0; i < conversation.length; i++) {
              appendMessage(conversation[i].role, conversation[i].content);
            }
          }
        } catch(e) { conversation = []; }
      }
    }

    function saveApiKey() {
      var key = document.getElementById('api-key-input').value.trim();
      if (!key) { alert('Please enter an API key.'); return; }
      API_KEY = key;
      try { localStorage.setItem('claude_api_key', key); } catch(e) {}
      showChat();
    }

    function changeKey() {
      document.getElementById('setup').style.display = 'block';
      document.getElementById('chat-container').style.display = 'none';
      document.getElementById('api-key-input').value = '';
    }

    function showChat() {
      document.getElementById('setup').style.display = 'none';
      document.getElementById('chat-container').style.display = 'block';
    }

    function saveConversation() {
      try { localStorage.setItem('claude_conversation', JSON.stringify(conversation)); } catch(e) {}
    }

    function clearChat() {
      conversation = [];
      saveConversation();
      document.getElementById('messages').innerHTML = '';
      setStatus('');
    }

    // --- Markdown parser ---
    function escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function inlineMarkdown(text) {
      // Split on `code spans`, keeping the delimiters at odd indices
      var parts = text.split(/(`[^`\n]+`)/);
      var out = '';
      for (var i = 0; i < parts.length; i++) {
        if (i % 2 === 1) {
          out += '<code>' + escapeHtml(parts[i].slice(1, -1)) + '</code>';
        } else {
          var s = escapeHtml(parts[i]);
          s = s.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
          s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
          s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
          out += s;
        }
      }
      return out;
    }

    function processBlock(text) {
      var lines = text.split('\n');
      var html = '';
      var listType = null;
      var listItems = [];
      var paraLines = [];

      function flushList() {
        if (!listItems.length) return;
        html += '<' + listType + '>';
        for (var j = 0; j < listItems.length; j++) html += '<li>' + listItems[j] + '</li>';
        html += '</' + listType + '>';
        listItems = []; listType = null;
      }
      function flushPara() {
        if (!paraLines.length) return;
        html += '<p>' + paraLines.join('<br>') + '</p>';
        paraLines = [];
      }

      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        if (line.trim() === '') { flushList(); flushPara(); continue; }

        var hm = line.match(/^(#{1,6})\s+(.+)$/);
        if (hm) {
          flushList(); flushPara();
          var lvl = hm[1].length;
          html += '<h' + lvl + '>' + inlineMarkdown(hm[2]) + '</h' + lvl + '>';
          continue;
        }

        var ulm = line.match(/^[-*+]\s+(.*)$/);
        if (ulm) {
          flushPara();
          if (listType !== 'ul') { flushList(); listType = 'ul'; }
          listItems.push(inlineMarkdown(ulm[1]));
          continue;
        }

        var olm = line.match(/^\d+[.)]\s+(.*)$/);
        if (olm) {
          flushPara();
          if (listType !== 'ol') { flushList(); listType = 'ol'; }
          listItems.push(inlineMarkdown(olm[1]));
          continue;
        }

        flushList();
        paraLines.push(inlineMarkdown(line));
      }
      flushList(); flushPara();
      return html;
    }

    function parseMarkdown(text) {
      var segments = [];
      var re = /```(\w*)\n?([\s\S]*?)```/g;
      var last = 0, m;
      while ((m = re.exec(text)) !== null) {
        if (m.index > last) segments.push({ type: 'text', val: text.slice(last, m.index) });
        segments.push({ type: 'code', val: m[2].replace(/\n$/, '') });
        last = re.lastIndex;
      }
      if (last < text.length) segments.push({ type: 'text', val: text.slice(last) });

      var html = '';
      for (var i = 0; i < segments.length; i++) {
        var seg = segments[i];
        html += seg.type === 'code'
          ? '<pre><code>' + escapeHtml(seg.val) + '</code></pre>'
          : processBlock(seg.val);
      }
      return html;
    }
    // --- End markdown parser ---

    function appendMessage(role, text) {
      var messagesDiv = document.getElementById('messages');
      var div = document.createElement('div');
      div.className = 'message ' + role + ' clearfix';
      var label = document.createElement('div');
      label.className = 'role-label';
      label.textContent = role === 'user' ? 'You' : 'Claude';
      var content = document.createElement('div');
      content.className = 'content';
      if (role === 'assistant') {
        content.innerHTML = parseMarkdown(text);
      } else {
        content.style.whiteSpace = 'pre-wrap';
        content.textContent = text;
      }
      div.appendChild(label);
      div.appendChild(content);
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function setStatus(msg) {
      document.getElementById('status').textContent = msg;
    }

    function sendMessage() {
      var input = document.getElementById('user-input');
      var text = input.value.trim();
      if (!text) return;
      if (!API_KEY) { alert('No API key set.'); return; }

      input.value = '';
      conversation.push({ role: 'user', content: text });
      saveConversation();
      appendMessage('user', text);
      setStatus('Waiting for Claude...');

      var btn = document.getElementById('send-btn');
      btn.disabled = true;

      var body = JSON.stringify({
        model: getModel(),
        max_tokens: 1024,
        messages: conversation
      });

      var xhr = new XMLHttpRequest();
      xhr.open('POST', 'https://api.anthropic.com/v1/messages', true);
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.setRequestHeader('x-api-key', API_KEY);
      xhr.setRequestHeader('anthropic-version', '2023-06-01');
      xhr.setRequestHeader('anthropic-dangerous-direct-browser-access', 'true');

      xhr.onreadystatechange = function() {
        if (xhr.readyState !== 4) return;
        btn.disabled = false;
        if (xhr.status === 200) {
          try {
            var resp = JSON.parse(xhr.responseText);
            var reply = resp.content[0].text;
            conversation.push({ role: 'assistant', content: reply });
            saveConversation();
            appendMessage('assistant', reply);
            setStatus('');
          } catch(e) {
            setStatus('Error parsing response.');
          }
        } else {
          var msg = 'Error ' + xhr.status;
          try {
            var err = JSON.parse(xhr.responseText);
            if (err.error && err.error.message) msg = err.error.message;
          } catch(e2) {}
          setStatus(msg);
          // Remove the last user message from history so it can be retried
          conversation.pop();
        }
      };

      xhr.onerror = function() {
        btn.disabled = false;
        setStatus('Network error. Check your connection.');
        conversation.pop();
      };

      xhr.send(body);
    }

    // Enter to send (Shift+Enter for newline)
    document.addEventListener('DOMContentLoaded', function() {
      init();
      var input = document.getElementById('user-input');
      if (input) {
        input.addEventListener('keydown', function(e) {
          if (e.keyCode === 13 && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
          }
        });
      }
    });
  </script>
</body>
</html>
