<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Georgia, serif;
      font-size: 18px;
      background: #fff;
      color: #000;
      padding: 10px;
    }
    h1 {
      font-size: 22px;
      text-align: center;
      padding: 10px 0;
      border-bottom: 2px solid #000;
      margin-bottom: 12px;
    }
    #setup {
      padding: 10px;
      border: 1px solid #000;
      margin-bottom: 10px;
    }
    #setup label { display: block; margin-bottom: 6px; font-weight: bold; }
    #api-key-input {
      width: 100%;
      padding: 8px;
      font-size: 16px;
      border: 1px solid #000;
      margin-bottom: 8px;
    }
    .btn-primary {
      padding: 10px 16px;
      font-size: 18px;
      background: #000;
      color: #fff;
      border: none;
      cursor: pointer;
      width: 100%;
    }
    .btn-secondary {
      padding: 8px;
      font-size: 16px;
      background: #fff;
      color: #000;
      border: 2px solid #000;
      cursor: pointer;
      width: 100%;
    }
    #chat-container { display: none; }
    #key-bar {
      font-size: 13px;
      margin-bottom: 8px;
      text-align: right;
    }
    #key-bar button {
      font-size: 13px;
      background: none;
      border: none;
      text-decoration: underline;
      cursor: pointer;
      padding: 0;
    }
    #messages {
      border: 1px solid #000;
      height: 420px;
      overflow-y: scroll;
      padding: 10px;
      margin-bottom: 8px;
      background: #f9f9f9;
    }
    .message { margin-bottom: 14px; }
    .role-label {
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 3px;
    }
    .message.user .role-label { text-align: right; }
    .message.user .content {
      background: #e0e0e0;
      display: inline-block;
      float: right;
      clear: both;
      padding: 6px 10px;
      max-width: 90%;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .message.assistant .content {
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .clearfix::after { content: ""; display: table; clear: both; }
    #status {
      text-align: center;
      font-style: italic;
      min-height: 22px;
      margin-bottom: 6px;
      font-size: 16px;
    }
    #user-input {
      width: 100%;
      padding: 10px;
      font-size: 18px;
      font-family: Georgia, serif;
      border: 2px solid #000;
      min-height: 80px;
      resize: vertical;
      margin-bottom: 8px;
      display: block;
    }
    #send-btn { margin-bottom: 6px; }
    #send-btn:disabled { background: #666; }
    #model-select {
      width: 100%;
      padding: 6px;
      font-size: 14px;
      border: 1px solid #000;
      margin-bottom: 8px;
    }
    .setup-note {
      font-size: 13px;
      color: #444;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <h1>Claude Chat</h1>

  <div id="setup">
    <label for="api-key-input">Anthropic API Key:</label>
    <input type="password" id="api-key-input" placeholder="sk-ant-..." autocomplete="off">
    <p class="setup-note">Your key is stored only in this browser's local storage and sent directly to Anthropic.</p>
    <br>
    <button class="btn-primary" onclick="saveApiKey()">Save &amp; Start Chatting</button>
  </div>

  <div id="chat-container">
    <div id="key-bar">
      <button onclick="changeKey()">Change API key</button>
    </div>

    <select id="model-select">
      <option value="claude-sonnet-4-6">Claude Sonnet 4.6 (recommended)</option>
      <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5 (faster)</option>
      <option value="claude-opus-4-6">Claude Opus 4.6 (most capable)</option>
    </select>

    <div id="messages"></div>
    <div id="status"></div>
    <textarea id="user-input" placeholder="Type your message here..."></textarea>
    <button id="send-btn" class="btn-primary" onclick="sendMessage()">Send</button>
    <button class="btn-secondary" onclick="clearChat()">Clear Chat</button>
  </div>

  <script>
    var API_KEY = '';
    var conversation = [];

    function getModel() {
      var sel = document.getElementById('model-select');
      return sel ? sel.value : 'claude-sonnet-4-6';
    }

    function init() {
      var stored = '';
      try { stored = localStorage.getItem('claude_api_key') || ''; } catch(e) {}
      if (stored) {
        API_KEY = stored;
        showChat();
      }
    }

    function saveApiKey() {
      var key = document.getElementById('api-key-input').value.trim();
      if (!key) { alert('Please enter an API key.'); return; }
      API_KEY = key;
      try { localStorage.setItem('claude_api_key', key); } catch(e) {}
      showChat();
    }

    function changeKey() {
      document.getElementById('setup').style.display = 'block';
      document.getElementById('chat-container').style.display = 'none';
      document.getElementById('api-key-input').value = '';
    }

    function showChat() {
      document.getElementById('setup').style.display = 'none';
      document.getElementById('chat-container').style.display = 'block';
    }

    function clearChat() {
      conversation = [];
      document.getElementById('messages').innerHTML = '';
      setStatus('');
    }

    function appendMessage(role, text) {
      var messagesDiv = document.getElementById('messages');
      var div = document.createElement('div');
      div.className = 'message ' + role + ' clearfix';
      var label = document.createElement('div');
      label.className = 'role-label';
      label.textContent = role === 'user' ? 'You' : 'Claude';
      var content = document.createElement('div');
      content.className = 'content';
      content.textContent = text;
      div.appendChild(label);
      div.appendChild(content);
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function setStatus(msg) {
      document.getElementById('status').textContent = msg;
    }

    function sendMessage() {
      var input = document.getElementById('user-input');
      var text = input.value.trim();
      if (!text) return;
      if (!API_KEY) { alert('No API key set.'); return; }

      input.value = '';
      conversation.push({ role: 'user', content: text });
      appendMessage('user', text);
      setStatus('Waiting for Claude...');

      var btn = document.getElementById('send-btn');
      btn.disabled = true;

      var body = JSON.stringify({
        model: getModel(),
        max_tokens: 1024,
        messages: conversation
      });

      var xhr = new XMLHttpRequest();
      xhr.open('POST', 'https://api.anthropic.com/v1/messages', true);
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.setRequestHeader('x-api-key', API_KEY);
      xhr.setRequestHeader('anthropic-version', '2023-06-01');
      xhr.setRequestHeader('anthropic-dangerous-direct-browser-access', 'true');

      xhr.onreadystatechange = function() {
        if (xhr.readyState !== 4) return;
        btn.disabled = false;
        if (xhr.status === 200) {
          try {
            var resp = JSON.parse(xhr.responseText);
            var reply = resp.content[0].text;
            conversation.push({ role: 'assistant', content: reply });
            appendMessage('assistant', reply);
            setStatus('');
          } catch(e) {
            setStatus('Error parsing response.');
          }
        } else {
          var msg = 'Error ' + xhr.status;
          try {
            var err = JSON.parse(xhr.responseText);
            if (err.error && err.error.message) msg = err.error.message;
          } catch(e2) {}
          setStatus(msg);
          // Remove the last user message from history so it can be retried
          conversation.pop();
        }
      };

      xhr.onerror = function() {
        btn.disabled = false;
        setStatus('Network error. Check your connection.');
        conversation.pop();
      };

      xhr.send(body);
    }

    // Enter to send (Shift+Enter for newline)
    document.addEventListener('DOMContentLoaded', function() {
      init();
      var input = document.getElementById('user-input');
      if (input) {
        input.addEventListener('keydown', function(e) {
          if (e.keyCode === 13 && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
          }
        });
      }
    });
  </script>
</body>
</html>
